
name: Build and Release Cloudberry Club APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find latest project ZIP
        shell: bash
        run: |
          set -euo pipefail

          BEST_ZIP=""
          BEST_DATE=0

          while IFS= read -r ZIP; do
            DATE=$(git log -1 --format=%ct -- "$ZIP")
            DATE=${DATE:-0}

            if unzip -Z1 "$ZIP" | grep -qE '(^|/)app/build.gradle$'; then
              if [ "$DATE" -ge "$BEST_DATE" ]; then
                BEST_DATE=$DATE
                BEST_ZIP=$ZIP
              fi
            fi
          done < <(find . -maxdepth 1 -type f -iname '*.zip')

          if [ -z "$BEST_ZIP" ]; then
            echo "::error::No project ZIP containing app/build.gradle was found."
            echo "Upload your Android project ZIP to the repository root."
            exit 1
          fi

          echo "Using project ZIP: $BEST_ZIP"

          mkdir -p extracted
          unzip -q "$BEST_ZIP" -d extracted

          BUILD_FILE=$(find extracted -type f \
            -path '*/app/build.gradle' -print -quit)

          PROJECT_DIR=$(dirname "$(dirname "$BUILD_FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Cloudberry-Club.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: release/Cloudberry-Club.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Cloudberry-Club.apk \
            --title "Cloudberry Club $GITHUB_REF_NAME" \
            --generate-notes
