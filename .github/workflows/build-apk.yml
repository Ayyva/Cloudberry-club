
name: Build Cloudberry Club APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudberry_club_refreshed_android_project_FIXED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="cloudberry_club_refreshed_android_project_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Could not find $ZIP_FILE in the repository root."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT="extracted/cloudberry_android_project"

          if [ ! -f "$PROJECT/gradlew" ] || [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: The Android project files were not found."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi

          chmod +x "$PROJECT/gradlew"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: extracted/cloudberry_android_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: extracted/cloudberry_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
