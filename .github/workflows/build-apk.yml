
name: Build Cloudberry Club APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find and extract project
        shell: bash
        run: |
          ZIP_FILE="cloudberry_club_refreshed_android_project_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Files available:"
            ls -la
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT=$(find extracted -type f -path '*/app/build.gradle' -print -quit | sed 's|/app/build.gradle$||')

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "ERROR: Gradle wrapper missing."
            exit 1
          fi

          chmod +x "$PROJECT/gradlew"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
