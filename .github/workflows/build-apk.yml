
name: Build Cloudberry Club APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        run: |
          set -e
          ZIP_FILE="cloudberry_club_no_coloring_android_project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted project files:"
          find android-project -maxdepth 4 -type f | head -200

      - name: Locate Gradle project
        run: |
          set -e
          GRADLE_FILE=$(find android-project -name gradlew -type f | head -1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle wrapper (gradlew) found in the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLE_FILE"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
