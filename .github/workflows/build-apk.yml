
name: Build Cloudberry Club APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app project
        run: unzip -q cloudberry_club_android_apk_project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/cloudberry_android_project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: extracted/cloudberry_android_project/app/build/outputs/apk/debug/app-debug.apk
