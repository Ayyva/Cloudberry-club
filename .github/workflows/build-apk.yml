
name: Build Cloudberry Club APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract fixed project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*fixed*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Could not find the fixed project ZIP in the repository."
            exit 1
          fi
          echo "Using project: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/cloudberry_android_project/app/build.gradle

      - name: Build APK
        run: gradle -p extracted/cloudberry_android_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: extracted/cloudberry_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
