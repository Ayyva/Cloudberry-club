
name: Build Cloudberry Club APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="cloudberry_club_routine_activity_library.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Upload $ZIP_FILE to the repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          BUILD_FILE=$(find extracted -type f \
            -path '*/app/build.gradle' -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Could not find app/build.gradle in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project at: $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
