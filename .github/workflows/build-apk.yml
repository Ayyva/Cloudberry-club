
name: Build Cloudberry Club APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find and extract Android project
        shell: bash
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT=$(find extracted -type f -path '*/app/build.gradle' -print -quit | sed 's|/app/build.gradle$||')

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not find the Android app project inside the ZIP."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "ERROR: Gradle wrapper is missing from $PROJECT"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          chmod +x "$PROJECT/gradlew"

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudberry-Club-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
